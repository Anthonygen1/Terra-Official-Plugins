{{- /*
Replaces /etc/nginx/templates/homelable.conf.template in the frontend image.
Content mirrors upstream docker/nginx.conf (v3.6.0); the only difference is
that the unauthenticated API-docs locations are dropped unless expose_api_docs
is set. The image's stock nginx entrypoint renders ${BACKEND_UPSTREAM} at start.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-nginx"
  namespace: {{ .Values.namespace }}
  labels:
    terra.juno-innovations.com/app: "{{ .Release.Name }}"
data:
  homelable.conf.template: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Proxy WebSocket (must be before /api/ to take priority)
        location /api/v1/status/ws/ {
            proxy_pass http://${BACKEND_UPSTREAM};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy API to backend
        location /api/ {
            proxy_pass http://${BACKEND_UPSTREAM};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
{{- if .Values.expose_api_docs }}

        # Interactive API docs — Swagger UI, ReDoc and the OpenAPI schema.
        # Not behind login upstream; enabled via expose_api_docs.
        location /docs {
            proxy_pass http://${BACKEND_UPSTREAM};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /redoc {
            proxy_pass http://${BACKEND_UPSTREAM};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /openapi.json {
            proxy_pass http://${BACKEND_UPSTREAM};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
{{- else }}

        # API docs hidden (expose_api_docs: false).
        location /docs { return 404; }
        location /redoc { return 404; }
        location = /openapi.json { return 404; }
{{- end }}

        # Proxy legacy /ws/ path
        location /ws/ {
            proxy_pass http://${BACKEND_UPSTREAM};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
