{{- /*
SECRET_KEY signs login tokens and must be stable across ArgoCD syncs, so it is
derived deterministically from the release and admin password rather than
generated randomly (a random value would re-render on every sync and log every
user out). Changing the password rotates it, which is the desired behaviour.
MCP_SERVICE_KEY is the internal shared secret between the MCP container and
the backend; it never leaves the pod.
*/ -}}
{{- $secretKey := printf "%s/%s/secret" .Release.Name .Values.admin_password | sha256sum -}}
{{- $mcpServiceKey := printf "%s/%s/mcp-service" .Release.Name .Values.admin_password | sha256sum -}}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-auth"
  namespace: {{ .Values.namespace }}
  labels:
    terra.juno-innovations.com/app: "{{ .Release.Name }}"
type: Opaque
stringData:
  admin_password: {{ .Values.admin_password | quote }}
  secret_key: {{ $secretKey | quote }}
  mcp_service_key: {{ $mcpServiceKey | quote }}
  mcp_api_key: {{ .Values.mcp_api_key | quote }}
