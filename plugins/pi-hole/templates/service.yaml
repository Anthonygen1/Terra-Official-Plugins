# Web admin dashboard — reached through the Ingress only.
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}"
  namespace: {{ .Values.namespace }}
  labels:
    terra.juno-innovations.com/app: "{{ .Release.Name }}"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    terra.juno-innovations.com/app: "{{ .Release.Name }}"
---
# DNS resolver — this is what clients / routers point at.
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-dns"
  namespace: {{ .Values.namespace }}
  labels:
    terra.juno-innovations.com/app: "{{ .Release.Name }}"
  annotations:
    # Created only after the Deployment (wave 0) is Healthy. k3s's built-in
    # ServiceLB implements LoadBalancer Services as a hostPort on every node;
    # for port 53 the CNI portmap rules DNAT the node's own loopback resolver
    # (systemd-resolved, 127.0.0.53) into this Service. If that happens before
    # the Pi-hole pod is Ready the node loses DNS and cannot even pull the
    # Pi-hole image. Ordering the Service after the pod avoids the deadlock.
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: {{ .Values.dns_service_type }}
  {{- if eq .Values.dns_service_type "LoadBalancer" }}
  {{- if .Values.loadbalancer_ip }}
  loadBalancerIP: {{ .Values.loadbalancer_ip | quote }}
  {{- end }}
  # Local keeps the client source IP so the dashboard shows real client
  # addresses, but only nodes running the pod are published. Cluster publishes
  # every node and survives the pod moving, at the cost of client IPs.
  externalTrafficPolicy: {{ .Values.external_traffic_policy }}
  {{- end }}
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
  selector:
    terra.juno-innovations.com/app: "{{ .Release.Name }}"
