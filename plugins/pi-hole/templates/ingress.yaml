{{- $prefix := trimSuffix "/" .Values.prefix -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Release.Name }}"
  namespace: {{ .Values.namespace }}
  labels:
    terra.juno-innovations.com/app: "{{ .Release.Name }}"
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://genesis.{{ .Release.Namespace }}.svc.cluster.local:3000/api/auth-service/{{ .Release.Name }}/"
    nginx.ingress.kubernetes.io/auth-signin: /unauthorized/
    {{- if $prefix }}
    # Pi-hole's FTL web server always serves at /admin/ and /api/. Its
    # webserver.paths.prefix setting only makes generated links and redirects
    # carry the prefix — it expects the reverse proxy to strip it. So strip it.
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: "{{ .Values.host }}"
      http:
        paths:
          {{- if $prefix }}
          - path: "{{ $prefix }}(/|$)(.*)"
            pathType: ImplementationSpecific
          {{- else }}
          - path: /
            pathType: Prefix
          {{- end }}
            backend:
              service:
                name: "{{ .Release.Name }}"
                port:
                  number: 80
