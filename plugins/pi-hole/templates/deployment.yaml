{{- $prefix := trimSuffix "/" .Values.prefix -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}"
  namespace: {{ .Values.namespace }}
  labels:
    terra.juno-innovations.com/app: "{{ .Release.Name }}"
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      terra.juno-innovations.com/app: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        terra.juno-innovations.com/app: "{{ .Release.Name }}"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pi-hole
          image: pihole/pihole:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-admin"
                  key: password
            - name: FTLCONF_dns_upstreams
              value: {{ .Values.upstream_dns | quote }}
            # Pod network interfaces are not "local" from FTL's point of view;
            # listen on all interfaces so Service traffic is answered.
            - name: FTLCONF_dns_listeningMode
              value: "all"
            # HTTP only — TLS is terminated at the ingress.
            - name: FTLCONF_webserver_port
              value: "80o"
            {{- if $prefix }}
            # Makes FTL generate links/redirects under the prefix. FTL still
            # serves at /admin/ and /api/; the Ingress rewrites the prefix away.
            - name: FTLCONF_webserver_paths_prefix
              value: {{ $prefix | quote }}
            {{- end }}
            # Pi-hole defaults to X-Frame-Options: DENY / CSP frame-ancestors 'none'.
            # The dashboard is served from the Genesis host and embedded in an
            # iFrame, so allow same-origin framing only.
            # NOTE: FTL splits array env vars on ';' as well as newlines, so a
            # multi-directive CSP cannot be passed here (it gets truncated to
            # "default-src 'none'", which blocks all CSS/JS). Use a single
            # frame-ancestors directive only.
            - name: FTLCONF_webserver_headers
              value: |-
                X-DNS-Prefetch-Control: off
                Content-Security-Policy: frame-ancestors 'self'
                X-Frame-Options: SAMEORIGIN
                X-XSS-Protection: 0
                X-Content-Type-Options: nosniff
                Referrer-Policy: strict-origin-when-cross-origin
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
          # FTL serves /admin/ unprefixed; the ingress strips the prefix.
          readinessProbe:
            httpGet:
              path: /admin/login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /admin/login
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /etc/pihole
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-data"
