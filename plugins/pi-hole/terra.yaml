resource_id: pi-hole
name: Pi-hole
icon: https://raw.githubusercontent.com/Anthonygen1/Terra-Official-Plugins/refs/heads/dev/plugins/pi-hole/assets/logo.png
description: Network-wide ad and tracker blocking DNS sinkhole, installed once per cluster with its admin dashboard embedded directly in Genesis. Point your devices or router at the exposed DNS service to block ads for every client on the network.
category: Infrastructure
tags:
  - dns
  - ad-blocking
  - networking
  - privacy
  - cluster-level
  - dashboard
editable: true
fields:
  - name: host
    description: The DNS name of your genesis host.
    required: true
  - name: prefix
    description: Connection URL prefix. i.e. `/pihole`. Will default to `/pihole` if not set. This doesn't need changing in most cases. The dashboard lives at `<prefix>/admin/`.
    required: false
    default: "/pihole"
  - name: admin_password
    description: Password for the Pi-hole admin dashboard login.
    required: true
  - name: upstream_dns
    description: Upstream DNS resolvers Pi-hole forwards non-blocked queries to. Semicolon-separated, optionally with `#port`, i.e. `1.1.1.1;1.0.0.1` or `10.0.0.2#5335`.
    required: true
    default: "1.1.1.1;1.0.0.1"
  - name: timezone
    description: Timezone used for query logs and statistics, i.e. `America/New_York`.
    required: true
    default: "UTC"
  - name: dns_service_type
    description: How the DNS resolver (port 53 TCP/UDP) is exposed. `LoadBalancer` requires a load-balancer provider such as MetalLB and gives clients a stable IP. `NodePort` exposes a high port on every node. `ClusterIP` keeps DNS reachable only from inside the cluster.
    required: true
    type: select
    default: LoadBalancer
    options:
      - LoadBalancer
      - NodePort
      - ClusterIP
  - name: loadbalancer_ip
    description: Optional fixed IP to request for the DNS LoadBalancer service, i.e. `192.168.1.53`. Must be inside your load-balancer address pool. Ignored unless `dns_service_type` is `LoadBalancer`.
    required: false
    default: ""
  - name: external_traffic_policy
    description: Traffic policy for the DNS LoadBalancer. `Local` preserves client IPs (dashboard shows real devices) but only publishes nodes where the Pi-hole pod runs. `Cluster` publishes every node and keeps working if the pod moves, but clients appear as node IPs. Ignored unless `dns_service_type` is `LoadBalancer`.
    required: true
    type: select
    default: Local
    options:
      - Local
      - Cluster
  - name: storage_size
    description: Size of the persistent volume holding Pi-hole configuration, blocklists (gravity database) and query logs, i.e. `2Gi`.
    required: true
    default: "2Gi"
  - name: storage_class
    description: StorageClass for the Pi-hole data volume. Leave empty to use the cluster default StorageClass.
    required: false
    default: ""
